# Tooling-only configuration. This skill is distributed as a Pi package
# (see package.json); there is intentionally no [project] table because it is
# not a buildable/importable Python distribution.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Conservative, critical-only selection: syntax/parse errors, undefined names,
# unused imports, and invalid comparisons. This avoids churning pre-existing
# style while still catching real breakage in CI.
select = ["E9", "F63", "F7", "F82"]
